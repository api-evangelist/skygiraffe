name: SkyGiraffe
description: >-
  SkyGiraffe was an enterprise-grade mobility platform that let companies build
  customized, job-specific mobile apps with no coding, connecting mobile
  workforces to corporate systems of record such as SAP, Oracle, Salesforce and
  ServiceNow. In 2016 the company added developer access, exposing a single
  secure endpoint for third-party apps to read from and write to those backend
  enterprise systems through the SkyGiraffe platform. Backed by 500 Startups (now
  500 Global), Microsoft Ventures, and Trilogy Equity Partners across ~$10.5M in
  funding, SkyGiraffe was acquired by ServiceNow on October 25, 2017 and its
  technology and team were absorbed into ServiceNow's Now Platform mobile
  capabilities. The independent skygiraffe.com domain no longer hosts a product,
  developer portal, or API — it 301-redirects to ServiceNow's acquisition
  announcement — so there is no live, independent API surface to enrich.
